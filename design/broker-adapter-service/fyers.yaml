metadata:
  broker: fyers
  api_base: "https://api.fyers.in/v2"
  websocket_url: "wss://api.fyers.in/socket/v2"
  version: "1.0.0"

operations:

  # --- Order Lifecycle ---
  place_order:
    endpoint: "/orders"
    method: POST
    request:
      mappings:
        order_type:
          MARKET: 2
          LIMIT: 1
          STOP_MARKET: 3
          STOP_LIMIT: 4
        product_type:
          INTRADAY: "INTRADAY"
          DELIVERY: "CNC"
          NRML: "MARGIN"
          BO: "BO"
          CO: "CO"
        side:
          BUY: 1
          SELL: -1
        tif:
          DAY: 0
          IOC: 1
      validations:
        order_types:
          LIMIT:
            rules:
              - type: all_required
                fields: [price]
          STOP_LIMIT:
            rules:
              - type: all_required
                fields: [price, stop_price]
          MARKET:
            rules:
              - type: forbidden
                fields: [price]
    response:
      mappings:
        status:
          open: PLACED
          pending: NEW
          complete: FILLED
          rejected: REJECTED
      validations:
        required: [id, status]

  modify_order:
    endpoint: "/orders"
    method: PUT
    request:
      mappings:
        order_id: id
        price: limitPrice
        qty: quantity
        stop_price: stopPrice
      validations:
        rules:
          - type: all_required
            fields: [order_id]
    response:
      mappings:
        status:
          modified: AMENDED
          rejected: REJECTED
      validations:
        required: [id, status]

  cancel_order:
    endpoint: "/orders"
    method: DELETE
    request:
      mappings:
        order_id: id
    response:
      mappings:
        status:
          cancelled: CANCELLED
          rejected: REJECTED
      validations:
        required: [id, status]

  get_order_status:
    endpoint: "/orders"
    method: GET
    response:
      mappings:
        status:
          open: PLACED
          pending: NEW
          complete: FILLED
          rejected: REJECTED
          cancelled: CANCELLED
          partially_filled: PARTIALLY_FILLED
      validations:
        required: [id, status]

  # --- Position Lifecycle ---
  exit_position:
    endpoint: "/positions"
    method: DELETE
    request:
      mappings:
        position_id: id
    response:
      mappings:
        status:
          closed: EXITED
          rejected: REJECTED
      validations:
        required: [id, status]

  convert_position:
    endpoint: "/positions"
    method: PUT
    request:
      mappings:
        position_id: id
        target_product_type:
          INTRADAY: "INTRADAY"
          DELIVERY: "CNC"
          NRML: "MARGIN"
    response:
      mappings:
        status:
          converted: CONVERTED
          rejected: REJECTED
      validations:
        required: [id, target_product_type]

  get_positions:
    endpoint: "/positions"
    method: GET
    response:
      mappings:
        symbol: symbol
        qty: netQty
        avg_price: avgPrice
        mtm: unrealizedPL
        pnl: realizedPL
      validations:
        required: [symbol, qty, avg_price]

  # --- Portfolio / Accounts ---
  get_funds:
    endpoint: "/funds"
    method: GET
    response:
      mappings:
        total_equity: fund_limit
        cash_balance: availableMargin
        used_margin: usedMargin
      validations:
        required: [total_equity, cash_balance]

  get_holdings:
    endpoint: "/holdings"
    method: GET
    response:
      mappings:
        symbol: symbol
        qty: quantity
        avg_cost: avgCost
        pnl: pnl
      validations:
        required: [symbol, qty, avg_cost]

  get_trades:
    endpoint: "/tradebook"
    method: GET
    response:
      mappings:
        trade_id: id
        symbol: symbol
        qty: qty
        price: fillPrice
        timestamp: fillTime
      validations:
        required: [trade_id, symbol, qty, price]

  # --- Market Data ---
  get_quotes:
    endpoint: "/data/quotes"
    method: GET
    request:
      params: [symbols]
    response:
      mappings:
        lp: last_price
        volume: traded_volume
        bid: best_bid
        ask: best_ask
      validations:
        required: [lp]

  get_depth:
    endpoint: "/data/depth"
    method: GET
    request:
      params: [symbol]
    response:
      mappings:
        bids: bid
        asks: ask
        spread: spread
      validations:
        required: [bids, asks]

  get_history:
    endpoint: "/data/history"
    method: GET
    request:
      params: [symbol, resolution, from, to]
    response:
      mappings:
        candles: candles
      validations:
        required: [candles]

  get_option_chain:
    endpoint: "/data/options-chain-v3"
    method: GET
    request:
      params: [symbol]
    response:
      mappings:
        strikes: strikes
        call: CE
        put: PE
      validations:
        required: [strikes]

  # --- WebSocket Feeds ---
  websocket:
    streams:
      orders:
        mappings:
          status:
            open: PLACED
            complete: FILLED
            rejected: REJECTED
            cancelled: CANCELLED
        events:
          - type: order.placed
          - type: order.filled
          - type: order.rejected
          - type: order.cancelled
      positions:
        mappings:
          symbol: symbol
          qty: netQty
          mtm: unrealizedPL
        events:
          - type: position.updated
      funds:
        mappings:
          total_equity: fund_limit
          cash_balance: availableMargin
        events:
          - type: funds.updated
      trades:
        mappings:
          trade_id: id
          symbol: symbol
          price: fillPrice
          qty: qty
        events:
          - type: trade.executed

# --- Self Tests ---
self_tests:
  request_examples:
    - name: "Valid LIMIT order"
      input:
        type: LIMIT
        side: BUY
        qty: 10
        price: 150.0
      expect: valid
    - name: "Invalid MARKET order with price"
      input:
        type: MARKET
        side: SELL
        qty: 5
        price: 120.0
      expect: invalid
